<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-title" content="LUCINE" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--seo-->
    <title>LUCINE — Thoughtful pieces, made for every moment.</title>
    <meta
      name="description"
      content="Shop the Lucine collection: thoughtfully chosen bags, jewellery, clothing and accessories. Complimentary delivery over $100 and easy 30-day returns."
    />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link rel="canonical" href="https://lucinestore.github.io/" />
    <link rel="alternate" hreflang="en" href="https://lucinestore.github.io/" />
    <link rel="alternate" hreflang="ar" href="https://lucinestore.github.io/?lang=ar" />
    <link rel="alternate" hreflang="x-default" href="https://lucinestore.github.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lucine Store" />
    <meta property="og:title" content="LUCINE — Thoughtful pieces, made for every moment." />
    <meta
      property="og:description"
      content="Shop the Lucine collection: thoughtfully chosen bags, jewellery, clothing and accessories."
    />
    <meta property="og:url" content="https://lucinestore.github.io/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_EG" />
    <meta property="og:image" content="https://lucinestore.github.io/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lucinestore" />
    <meta name="twitter:title" content="LUCINE — Thoughtful pieces, made for every moment." />
    <meta
      name="twitter:description"
      content="Shop the Lucine collection: thoughtfully chosen bags, jewellery, clothing and accessories."
    />
    <meta name="twitter:image" content="https://lucinestore.github.io/og-default.png" />
    <!--/seo-->
    <!--
      Site-wide structured data (Organization + WebSite) and per-page JSON-LD
      are injected here at build time by scripts/seo-prerender.mjs and kept in
      sync at runtime by src/components/seo/Seo.tsx. They share one source of
      truth in src/lib/seo.ts, so there is nothing to hard-code by hand.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
